[project]
name = "prodato"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "google-cloud-storage>=3.17.1",
    "pydantic-settings>=2.16.2",
    "ruff>=0.17.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",  # Import errors
    "E7",  # Statement errors
    "E9",  # Runtime errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "UP",  # Python syntax modernization
    "B",   # Common bugs
    "SIM", # Code simplification
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
